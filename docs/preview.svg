<svg xmlns="http://www.w3.org/2000/svg" width="760" height="150" viewBox="0 0 760 150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="760" height="150" fill="#1a1a1a"/>
  <rect x="10" y="10" width="740" height="130" rx="12" fill="#232323"/>
  <text x="28" y="40" font-size="15" fill="#8a8a8a">Context window</text>
  <text x="318" y="40" font-size="15" fill="#8a8a8a" text-anchor="end">62.5k / 1M (6%)</text>
  <defs>
    <pattern id="dots" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="3" fill="#2c2c2c"/><rect width="1.5" height="1.5" fill="#444"/>
    </pattern>
  </defs>
  <rect x="28" y="50" width="290" height="16" fill="url(#dots)"/>
  <rect x="28" y="50" width="18" height="16" fill="#7aa5ea"/>
  <g font-size="14" fill="#e8e8e8">
    <rect x="28" y="88" width="88" height="30" rx="6" fill="#363636"/>
    <text x="72" y="108" text-anchor="middle">Compact</text>
    <rect x="124" y="88" width="68" height="30" rx="6" fill="#363636"/>
    <text x="158" y="108" text-anchor="middle">Clear</text>
    <rect x="200" y="88" width="120" height="30" rx="6" fill="#363636"/>
    <text x="260" y="108" text-anchor="middle">Commit &amp; push</text>
    <rect x="328" y="88" width="128" height="30" rx="6" fill="#363636"/>
    <text x="392" y="108" text-anchor="middle">Clear + handoff</text>
  </g>
</svg>
